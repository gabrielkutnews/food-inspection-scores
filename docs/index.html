<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Without this the page lays out at ~980px inside an iframe and the whole UI
     renders at roughly 40% size on a phone. htmlwidgets::saveWidget omits it. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Austin-area food establishment inspection scores</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="">
<style>
  :root {
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --line: #e2e2e2;
    --panel-bg: rgba(255,255,255,.97);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body { font-family: var(--font); color: var(--ink); -webkit-text-size-adjust: 100%; }

  #map { position: absolute; inset: 0; background: #f5f5f3; }
  .leaflet-container { font-family: var(--font); }

  /* ---- overlays ---- */
  .ui { position: absolute; z-index: 1000; }

  .search-wrap { top: 10px; left: 10px; right: 58px; max-width: 340px; }
  #search {
    width: 100%; padding: 9px 30px 9px 11px; font-size: 15px; font-family: var(--font);
    border: 1px solid #cfcfcf; border-radius: 6px; background: #fff;
    box-shadow: 0 1px 6px rgba(0,0,0,.16); color: var(--ink);
  }
  #search:focus { outline: 2px solid #2f6fb0; outline-offset: -1px; border-color: #2f6fb0; }
  #search-clear {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    border: 0; background: none; cursor: pointer; font-size: 17px; line-height: 1;
    color: var(--muted); padding: 4px 6px; display: none;
  }
  #results {
    margin-top: 4px; background: #fff; border: 1px solid var(--line); border-radius: 6px;
    box-shadow: 0 4px 14px rgba(0,0,0,.18); overflow: hidden; display: none;
  }
  #results li {
    list-style: none; padding: 8px 10px; cursor: pointer; display: flex;
    gap: 9px; align-items: center; border-bottom: 1px solid #f0f0f0;
  }
  #results li:last-child { border-bottom: 0; }
  #results li:hover, #results li[aria-selected="true"] { background: #eef4fb; }
  #results ul { margin: 0; padding: 0; }
  .r-name { font-size: 13.5px; font-weight: 600; line-height: 1.25; }
  .r-addr { font-size: 11.5px; color: var(--muted); line-height: 1.25; }
  .r-text { min-width: 0; flex: 1; }
  .r-text > div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip {
    flex: 0 0 auto; width: 32px; height: 24px; border-radius: 4px; color: #fff;
    font-size: 12px; font-weight: 700; display: grid; place-items: center;
    text-shadow: 0 1px 1px rgba(0,0,0,.28);
  }
  .no-hits { padding: 10px; font-size: 12.5px; color: var(--muted); }

  .panel {
    top: 10px; right: 10px; width: 232px; background: var(--panel-bg);
    border-radius: 7px; box-shadow: 0 1px 8px rgba(0,0,0,.2); overflow: hidden;
  }
  .panel h2 {
    margin: 0; padding: 9px 11px 7px; font-size: 11px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--muted); font-weight: 700;
    border-bottom: 1px solid var(--line);
  }
  .panel-body { padding: 7px 11px 10px; }
  .row {
    display: flex; align-items: center; gap: 8px; padding: 4px 0;
    font-size: 13.5px; cursor: pointer; user-select: none;
  }
  .row input { margin: 0; cursor: pointer; flex: 0 0 auto; accent-color: #444; }
  .sw { width: 13px; height: 13px; border-radius: 3px; flex: 0 0 auto; border: 1px solid rgba(0,0,0,.28); }
  .row .lbl { flex: 1; }
  .row .cnt { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .divider { height: 1px; background: var(--line); margin: 8px 0 6px; }
  select {
    width: 100%; font-family: var(--font); font-size: 13px; padding: 5px 6px;
    border: 1px solid #cfcfcf; border-radius: 5px; background: #fff; color: var(--ink);
  }
  .sub { font-size: 11.5px; color: var(--muted); line-height: 1.45; margin-top: 8px; }
  .window-note {
    font-size: 11.5px; line-height: 1.45; color: #4a3d18; background: #fdf8e8;
    border: 1px solid #ecdfae; border-radius: 5px; padding: 6px 8px; margin: 9px 0 0;
  }

  #panel-toggle {
    top: 10px; right: 10px; width: 38px; height: 38px; border-radius: 7px;
    border: 0; background: var(--panel-bg); box-shadow: 0 1px 8px rgba(0,0,0,.2);
    cursor: pointer; display: none; font-size: 17px; line-height: 1;
  }

  .credit {
    bottom: 0; left: 0; right: 0; padding: 5px 10px; font-size: 10.5px;
    color: var(--muted); background: rgba(255,255,255,.9); line-height: 1.45;
    border-top: 1px solid var(--line);
  }
  .credit a { color: var(--muted); }
  /* Keep the zoom buttons clear of the credit bar. */
  .leaflet-bottom.leaflet-right .leaflet-control-zoom { margin-bottom: 42px; }

  /* ---- popup ---- */
  .leaflet-popup-content { margin: 11px 13px; min-width: 200px; }
  .leaflet-popup-content-wrapper { border-radius: 7px; }
  .pop-name { font-size: 14.5px; font-weight: 700; line-height: 1.3; }
  .pop-addr { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.35; }
  .pop-score { display: flex; align-items: center; gap: 8px; margin: 9px 0 7px; }
  .pop-score .chip { width: 42px; height: 32px; font-size: 15px; border-radius: 5px; }
  .pop-score .bucket { font-size: 12px; color: var(--muted); }
  .pop-meta { font-size: 12px; line-height: 1.55; border-top: 1px solid var(--line); padding-top: 6px; }
  .pop-meta b { font-weight: 600; }
  .warn { color: #a33; }

  /* iOS zooms the whole page when a focused input has font-size < 16px, which on a map
     embed leaves the reader zoomed in with no obvious way back. 16px is the floor. */
  @media (max-width: 900px) {
    #search { font-size: 16px; padding: 11px 32px 11px 12px; }
    select  { font-size: 16px; padding: 9px 8px; }
  }

  @media (max-width: 640px) {
    .panel {
      display: none; width: auto; left: 10px; right: 10px; top: 58px;
      /* With eight establishment types the panel can outgrow a short phone screen. */
      max-height: calc(100% - 120px); overflow-y: auto; -webkit-overflow-scrolling: touch;
    }
    .panel.open { display: block; }
    #panel-toggle { display: block; width: 44px; height: 44px; font-size: 19px; }

    .search-wrap { max-width: none; right: 64px; }
    /* 44px is the minimum comfortable touch target; 6px padding gave about 28px. */
    .row { padding: 9px 0; font-size: 15px; min-height: 44px; }
    .row input { width: 20px; height: 20px; }
    .sw { width: 15px; height: 15px; }
    .row .cnt { font-size: 13px; }
    #results li { padding: 12px 10px; min-height: 52px; }
    #results { max-height: 60vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .r-name { font-size: 15px; }
    .r-addr { font-size: 12.5px; }
    #search-clear { font-size: 22px; padding: 8px 10px; }

    /* The full credit runs to five lines on a phone and eats a third of the map. */
    .credit-long { display: none; }
    .credit { font-size: 10px; padding: 4px 8px; }
    /* Pinch-to-zoom covers this on touch; the buttons only crowd the credit bar. */
    .leaflet-control-zoom { display: none; }

    /* A popup sized for desktop overflows a 375px screen and clips its own close
       button, which on touch leaves no way to dismiss it. */
    .leaflet-popup-content { margin: 12px 14px; min-width: 0; }
    .leaflet-popup-content-wrapper { max-width: 78vw; }
    .pop-name { font-size: 15.5px; }
    .pop-meta { font-size: 12.5px; }
    .leaflet-popup-close-button { width: 34px !important; height: 34px !important;
      font-size: 22px !important; padding: 6px 0 0 0 !important; }
  }
</style>
</head>
<body>

<div id="map"></div>

<div class="ui search-wrap">
  <div style="position:relative">
    <input id="search" type="text" autocomplete="off" spellcheck="false"
           placeholder="Search a name, street or ZIP…"
           aria-label="Search establishments by name, street or ZIP code"
           role="combobox" aria-expanded="false" aria-controls="results">
    <button id="search-clear" type="button" aria-label="Clear search">&times;</button>
  </div>
  <div id="results" role="listbox"><ul></ul></div>
</div>

<button id="panel-toggle" class="ui" type="button" aria-label="Show filters" aria-expanded="false">☰</button>

<div class="panel ui" id="panel">
  <h2>Inspection score</h2>
  <div class="panel-body">
    <div id="buckets"></div>
    <div class="divider"></div>
    <div>
      <select id="category" aria-label="Filter by establishment type">
        <option value="all">All establishment types</option>
      </select>
    </div>
    <!-- The recency window is a hard filter applied in R/prep.R, not a toggle. It has to
         be stated, or the reader has no way to know what is missing. -->
    <p class="window-note" id="window-note"></p>
    <div class="sub" id="summary"></div>
  </div>
</div>

<div class="credit ui">
  <span class="credit-long">Most recent inspection per establishment. Includes schools, stores
  and care facilities as well as restaurants, and covers surrounding jurisdictions.
  <span id="gen"></span></span>
  Source: City of Austin. Map &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>,
  &copy; <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>.
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
<script>
(function () {
  'use strict';

  var map = L.map('map', {
    preferCanvas: true,
    scrollWheelZoom: false,     // re-enabled on click, so scrolling past the embed
    zoomControl: false,         // does not trap the reader in the map
    attributionControl: false   // attribution lives in the credit bar instead
  }).setView([30.2849, -97.7341], 11);

  L.control.zoom({ position: 'bottomright' }).addTo(map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    subdomains: 'abcd', maxZoom: 19
  }).addTo(map);
  map.on('click', function () {
    map.scrollWheelZoom.enable();
    // On a phone the panel covers most of the map; tapping the map should dismiss it
    // rather than forcing a second trip to the hamburger.
    var panel = document.getElementById('panel');
    if (panel && panel.classList.contains('open')) {
      panel.classList.remove('open');
      var t = document.getElementById('panel-toggle');
      if (t) { t.setAttribute('aria-expanded', 'false'); t.setAttribute('aria-label', 'Show filters'); }
    }
  });
  map.on('mouseout', function () { map.scrollWheelZoom.disable(); });

  // A container that is hidden or not yet laid out reports zero size. Leaflet
  // divides by that in flyTo and throws "Invalid LatLng object: (NaN, NaN)".
  // Real embeds hit this: an iframe inside a collapsed tab, or lazy-loaded below
  // the fold, has no size until the reader reveals it.
  function mapHasSize() {
    var s = map.getSize();
    return s.x > 0 && s.y > 0;
  }
  if (window.ResizeObserver) {
    new ResizeObserver(function () {
      if (mapHasSize()) map.invalidateSize();
    }).observe(document.getElementById('map'));
  }

  var renderer = L.canvas({ padding: 0.5 });
  var isSmall  = window.matchMedia('(max-width: 640px)').matches;

  // Markers are drawn worst-score-last so a 63 is never buried under a
  // neighbouring 100. At low zoom that would badly overstate how much of the map
  // is orange -- 5,500 dots overlap heavily at citywide view, and the 8% that
  // score 70-79 all land on top of the 66% that score 90+. Shrinking the dots as
  // you zoom out keeps them from colliding, so the colour mix a reader sees
  // matches the counts in the panel.
  function radiusFor(z) {
    var r = z <= 10 ? 2.5 : z <= 11 ? 3.5 : z <= 12 ? 4.5 : z <= 13 ? 5.5 : z <= 15 ? 6.5 : 8;
    // Slightly LARGER on touch, not smaller: a fingertip is far less precise than a
    // cursor, and a circleMarker's hit area is exactly its radius.
    return isSmall ? Math.max(r * 1.15, 4) : r;
  }
  var curRadius = null;

  // Filled once the payload lands.
  var D, ROWS, CITY, CAT, BUCKETS, BKEYS, COLOR, LABEL;
  var markers = [], bucketOf = [], searchIdx = [], groups = {};
  var shown, cutoff;

  var state = { buckets: {}, category: 'all' };

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  // Total on bad input. A payload built before the data_through/cutoff keys existed
  // can still be in a reader's cache for up to the GitHub Pages max-age after a
  // deploy; throwing here would happen inside buildPanel, before the marker layers
  // are added, and leave a blank map rather than a stale one.
  var fmtDate = function (iso) {
    if (!iso || typeof iso !== 'string') return '';
    var p = iso.split('-');
    if (p.length !== 3) return iso;
    var m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return (m[+p[1] - 1] || '?') + ' ' + (+p[2]) + ', ' + p[0];
  };
  var comma = function (n) { return n.toLocaleString('en-US'); };

  fetch('data/points.json')
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(init)
    .catch(function (e) {
      $('summary').innerHTML = '<span class="warn">Could not load the data (' +
        esc(e.message) + ').</span>';
    });

  function init(data) {
    D = data;
    ROWS = data.rows; CITY = data.cities; CAT = data.categories;
    BUCKETS = data.buckets;
    BKEYS = BUCKETS.map(function (b) { return b.key; });
    COLOR = {}; LABEL = {};
    BUCKETS.forEach(function (b) { COLOR[b.key] = b.color; LABEL[b.key] = b.label; });
    cutoff = data.cutoff;

    // Field positions, read from the header rather than hardcoded.
    var F = {};
    data.fields.forEach(function (f, i) { F[f] = i; });

    BKEYS.forEach(function (k) { state.buckets[k] = true; groups[k] = L.layerGroup(); });
    shown = new Uint8Array(ROWS.length);

    for (var i = 0; i < ROWS.length; i++) {
      var r = ROWS[i], s = r[F.s];
      var key = s <= 69 ? 'red' : s <= 79 ? 'orange' : s <= 89 ? 'yellow' : 'green';
      bucketOf.push(key);

      markers.push(
        L.circleMarker([r[F.y], r[F.x]], {
          renderer: renderer,
          radius: radiusFor(map.getZoom()),
          color: 'rgba(0,0,0,.45)',
          weight: 1,
          fillColor: COLOR[key],
          fillOpacity: 0.85
          // A fixed 300px popup overflows a phone screen and clips its close button.
        }).bindPopup(popupHtml.bind(null, i, F),
                     { maxWidth: Math.min(300, Math.round(window.innerWidth * 0.78)) })
      );

      searchIdx.push(
        (r[F.n] + ' ' + r[F.a] + ' ' + CITY[r[F.c]] + ' ' + r[F.z]).toLowerCase()
      );
    }

    buildPanel(F);
    BKEYS.forEach(function (k) { groups[k].addTo(map); });
    applyFilters(F);
    wireSearch(F);

    curRadius = radiusFor(map.getZoom());
    map.on('zoomend', function () {
      var r = radiusFor(map.getZoom());
      if (r === curRadius) return;
      curRadius = r;
      for (var j = 0; j < markers.length; j++) markers[j].setRadius(r);
    });

    // Three dates, stated separately. "Data generated <today>" alone implied the
    // scores were current as of today when the newest one was 73 days old.
    // State the hard filter plainly. Without this the reader cannot tell that ~1,000
    // establishments are absent because their last inspection is too old.
    $('window-note').innerHTML = (D.cutoff && D.data_through)
      ? 'Map only shows restaurants with inspections after <b>' + fmtDate(D.cutoff) +
        '</b> and <b>' + fmtDate(D.data_through) + "</b>, the latest available data. 
      : '';

    $('gen').textContent = data.data_through
      ? 'Inspection records through ' + fmtDate(data.data_through) +
        '; page built ' + fmtDate(data.generated) + '.'
      : 'Page built ' + fmtDate(data.generated) + '.';
  }

  // ---- filtering -------------------------------------------------------------

  function passes(i, F) {
    // No date test here: R/prep.R applies the recency window before writing the
    // payload, so every row present is already inside it.
    var r = ROWS[i];
    if (state.category !== 'all' && r[F.k] !== state.category) return false;
    return true;
  }

  function applyFilters(F) {
    var counts = {}, visible = 0;
    BKEYS.forEach(function (k) { counts[k] = 0; });

    for (var i = 0; i < ROWS.length; i++) {
      var ok = passes(i, F), key = bucketOf[i];
      if (ok) counts[key]++;
      if (ok && !shown[i]) { groups[key].addLayer(markers[i]); shown[i] = 1; }
      else if (!ok && shown[i]) { groups[key].removeLayer(markers[i]); shown[i] = 0; }
    }

    BKEYS.forEach(function (k) {
      var on = state.buckets[k];
      if (on && !map.hasLayer(groups[k])) map.addLayer(groups[k]);
      if (!on && map.hasLayer(groups[k])) map.removeLayer(groups[k]);
      $('cnt-' + k).textContent = comma(counts[k]);
      if (on) visible += counts[k];
    });

    $('summary').innerHTML =
      '<b>' + comma(visible) + '</b> of ' + comma(D.n_mapped) + ' mapped establishments shown.' +
      (D.n_total > D.n_mapped
        ? '<br>' + 'Four locations could not be placed on the map.'
        : '');
  }

  function buildPanel(F) {
    var host = $('buckets');
    // Highest scores first in the legend, matching how people read the scale.
    BUCKETS.slice().reverse().forEach(function (b) {
      var lab = document.createElement('label');
      lab.className = 'row';
      lab.innerHTML =
        '<input type="checkbox" checked data-bucket="' + b.key + '">' +
        '<span class="sw" style="background:' + b.color + '"></span>' +
        '<span class="lbl">' + b.label + '</span>' +
        '<span class="cnt" id="cnt-' + b.key + '">–</span>';
      lab.querySelector('input').addEventListener('change', function (e) {
        state.buckets[b.key] = e.target.checked;
        applyFilters(F);
      });
      host.appendChild(lab);
    });

    var sel = $('category');
    CAT.forEach(function (c, i) {
      var o = document.createElement('option');
      o.value = String(i); o.textContent = c;
      sel.appendChild(o);
    });
    sel.addEventListener('change', function (e) {
      state.category = e.target.value === 'all' ? 'all' : +e.target.value;
      applyFilters(F);
    });

    var toggle = $('panel-toggle');
    toggle.addEventListener('click', function () {
      var open = $('panel').classList.toggle('open');
      toggle.setAttribute('aria-expanded', String(open));
      toggle.setAttribute('aria-label', open ? 'Hide filters' : 'Show filters');
    });
  }

  // ---- popup -----------------------------------------------------------------

  function popupHtml(i, F) {
    var r = ROWS[i], key = bucketOf[i];
    var bits = [];

    bits.push('<b>Inspected</b> ' + fmtDate(r[F.d]) +
      (r[F.f] ? ' &middot; follow-up re-check' : ''));
    bits.push('<b>' + r[F.q] + '</b> inspection' + (r[F.q] === 1 ? '' : 's') + ' on record');
    bits.push(CAT[r[F.k]]);
    if (r[F.u] > 0) {
      bits.push('Shares an address with ' + r[F.u] + ' other establishment' +
        (r[F.u] === 1 ? '' : 's') + '; pins at this address are nudged apart.');
    }

    return '<div class="pop-name">' + esc(r[F.n]) + '</div>' +
      '<div class="pop-addr">' + esc(r[F.a]) + '<br>' +
        esc(CITY[r[F.c]]) + ', TX ' + esc(r[F.z]) + '</div>' +
      '<div class="pop-score">' +
        '<span class="chip" style="background:' + COLOR[key] + '">' + r[F.s] + '</span>' +
        '<span class="bucket">' + LABEL[key] + '</span>' +
      '</div>' +
      '<div class="pop-meta">' + bits.join('<br>') + '</div>';
  }

  // ---- search ----------------------------------------------------------------

  function wireSearch(F) {
    var input = $('search'), box = $('results'), list = box.querySelector('ul');
    var clear = $('search-clear');
    var hits = [], active = -1, timer = null;

    function close() {
      box.style.display = 'none';
      input.setAttribute('aria-expanded', 'false');
      active = -1;
    }

    function render() {
      if (!hits.length) {
        list.innerHTML = '<li class="no-hits" role="presentation">No establishment matches that.</li>';
        box.style.display = 'block';
        input.setAttribute('aria-expanded', 'true');
        return;
      }
      list.innerHTML = hits.map(function (i, n) {
        var r = ROWS[i];
        return '<li role="option" data-n="' + n + '" aria-selected="false">' +
          '<span class="chip" style="background:' + COLOR[bucketOf[i]] + '">' + r[F.s] + '</span>' +
          '<span class="r-text"><div class="r-name">' + esc(r[F.n]) + '</div>' +
          '<div class="r-addr">' + esc(r[F.a]) + ', ' + esc(CITY[r[F.c]]) + '</div></span></li>';
      }).join('');
      box.style.display = 'block';
      input.setAttribute('aria-expanded', 'true');
    }

    function highlight(n) {
      var items = list.querySelectorAll('li[data-n]');
      items.forEach(function (el) { el.setAttribute('aria-selected', 'false'); });
      if (n >= 0 && items[n]) {
        items[n].setAttribute('aria-selected', 'true');
        items[n].scrollIntoView({ block: 'nearest' });
      }
      active = n;
    }

    function search() {
      var q = input.value.trim().toLowerCase();
      clear.style.display = q ? 'block' : 'none';
      if (q.length < 2) { hits = []; close(); return; }
      hits = [];
      for (var i = 0; i < searchIdx.length && hits.length < 8; i++) {
        if (searchIdx[i].indexOf(q) !== -1) hits.push(i);
      }
      render();
    }

    // A match must stay reachable even when the current filters would hide it,
    // otherwise the toggles and the search silently fight each other.
    function select(i) {
      var r = ROWS[i], changed = false;
      if (!state.buckets[bucketOf[i]]) {
        state.buckets[bucketOf[i]] = true;
        document.querySelectorAll('[data-bucket]').forEach(function (cb) {
          cb.checked = state.buckets[cb.dataset.bucket];
        });
        changed = true;
      }
      if (state.category !== 'all' && r[F.k] !== state.category) {
        state.category = 'all'; $('category').value = 'all'; changed = true;
      }
      if (changed) applyFilters(F);

      close();
      input.blur();

      // Register before flyTo: if the map is already at the target the move
      // completes synchronously and moveend fires before a listener added after
      // the call would exist. The timeout covers the case where it never fires.
      var opened = false;
      var open = function () {
        if (opened) return;
        opened = true;
        markers[i].openPopup();
      };
      map.once('moveend', open);
      if (mapHasSize()) {
        map.flyTo([r[F.y], r[F.x]], 17, { duration: 0.8 });
      } else {
        map.setView([r[F.y], r[F.x]], 17, { animate: false });
      }
      setTimeout(open, 1200);
    }

    input.addEventListener('input', function () {
      clearTimeout(timer);
      timer = setTimeout(search, 120);
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { close(); input.blur(); return; }
      if (!hits.length) return;
      if (e.key === 'ArrowDown') { e.preventDefault(); highlight((active + 1) % hits.length); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); highlight((active - 1 + hits.length) % hits.length); }
      else if (e.key === 'Enter') { e.preventDefault(); select(hits[active < 0 ? 0 : active]); }
    });
    list.addEventListener('click', function (e) {
      var li = e.target.closest('li[data-n]');
      if (li) select(hits[+li.dataset.n]);
    });
    clear.addEventListener('click', function () {
      input.value = ''; hits = []; clear.style.display = 'none'; close(); input.focus();
    });
    document.addEventListener('click', function (e) {
      if (!e.target.closest('.search-wrap')) close();
    });
  }
})();
</script>
</body>
</html>
